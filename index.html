<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f1e8">
    <title>Something Special ♡</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="locker-page" id="lockerPage">

        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>

        <section class="safe" id="safe">

            <div class="safe-glow"></div>

            <div class="safe-frame">

                <div class="safe-top">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="brand">
                    <span>PRIVATE</span>
                    <b>♡</b>
                    <span>LOVE LOCKER</span>
                </div>

                <div class="display">
                    <div class="display-frame">

                        <div class="display-screen">

                            <div class="display-label">
                                COMBINATION
                            </div>

                            <div class="sequence" id="sequence">
                                <span class="sequence-slot active">—</span>
                                <span class="sequence-dot">•</span>
                                <span class="sequence-slot">—</span>
                                <span class="sequence-dot">•</span>
                                <span class="sequence-slot">—</span>
                            </div>

                            <div class="rolling-number">
                                <div class="rolling-track" id="rollingTrack">
                                    <span>0</span>
                                    <span>1</span>
                                    <span>2</span>
                                    <span>3</span>
                                    <span>4</span>
                                    <span>5</span>
                                    <span>6</span>
                                    <span>7</span>
                                    <span>8</span>
                                    <span>9</span>
                                    <span>10</span>
                                </div>
                            </div>

                            <div class="display-line"></div>

                        </div>
                    </div>
                </div>

                <div class="dial-area">

                    <div class="dial-pointer">
                        <span></span>
                    </div>

                    <div class="dial-shadow"></div>

                    <div class="dial-outer">

                        <div class="dial" id="dial">

                            <div class="dial-face">

                                <div class="dial-ticks" id="dialTicks"></div>

                                <div class="dial-numbers" id="dialNumbers">

                                    <span data-number="0">0</span>
                                    <span data-number="1">1</span>
                                    <span data-number="2">2</span>
                                    <span data-number="3">3</span>
                                    <span data-number="4">4</span>
                                    <span data-number="5">5</span>
                                    <span data-number="6">6</span>
                                    <span data-number="7">7</span>
                                    <span data-number="8">8</span>
                                    <span data-number="9">9</span>
                                    <span data-number="10">10</span>

                                </div>

                                <div class="dial-center">

                                    <div class="center-ring outer"></div>
                                    <div class="center-ring middle"></div>

                                    <div class="center-cap">
                                        <span>♡</span>
                                    </div>

                                    <div class="center-mark"></div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="lock" id="lock">

                    <div class="shackle">
                        <span></span>
                    </div>

                    <div class="lock-body">
                        <div class="lock-highlight"></div>

                        <div class="keyhole">
                            <span></span>
                        </div>
                    </div>

                </div>

                <div class="handle" id="handle">
                    <div class="handle-cap top"></div>
                    <div class="handle-bar"></div>
                    <div class="handle-cap bottom"></div>
                </div>

                <div class="bolts">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="bottom-detail">
                    <span></span>
                    <b>♡</b>
                    <span></span>
                </div>

                <div class="safe-door-light"></div>

            </div>

        </section>

        <div class="entry-status" id="entryStatus">

            <div class="status-dots">
                <span class="status-dot active"></span>
                <span class="status-dot"></span>
                <span class="status-dot"></span>
            </div>

            <span id="statusText">Turn the dial</span>

        </div>

        <div class="cinematic-light" id="cinematicLight"></div>

        <div class="particles" id="particles"></div>

    </main>

    <script src="locker.js"></script>
</body>
</html>
